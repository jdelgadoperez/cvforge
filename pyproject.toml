[project]
name = "cvforge"
version = "0.2.0"
description = "Turn a markdown resume into a styled PDF (ReportLab) or structured JSON."
readme = "README.md"
license = "MIT"
authors = [{ name = "Jess Delgado Perez" }]
requires-python = ">=3.11"
dependencies = [
    "python-dateutil>=2.9.0.post0",
    "reportlab>=4.4.7",
]

[project.scripts]
cvforge = "cvforge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cvforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
# Lint/format Python sources only (not code blocks in README.md / CLAUDE.md).
extend-exclude = ["*.md"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
