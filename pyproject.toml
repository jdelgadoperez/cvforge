[project]
name = "cvforge"
version = "0.2.0"
description = "Turn a markdown resume into a styled PDF (ReportLab) or structured JSON."
readme = "README.md"
license = "MIT"
authors = [{ name = "Jess Delgado Perez" }]
requires-python = ">=3.11"
dependencies = [
    "python-dateutil>=2.9.0.post0",
    "reportlab>=4.4.7",
]

[project.scripts]
cvforge = "cvforge.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cvforge"]
